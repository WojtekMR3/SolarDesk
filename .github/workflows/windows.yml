name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.4xx'
      - name: Build, test, and package
        shell: pwsh
        run: ./package.ps1
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunsetMonitor-win-x64
          path: artifacts/releases/*
          if-no-files-found: error
      - name: Upload UI check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-checks
          path: |
            artifacts/ui-smoke.txt
            artifacts/preview.png
            artifacts/theme-day.png
            artifacts/theme-night.png
            artifacts/tray-day.png
            artifacts/tray-night.png
          if-no-files-found: ignore
